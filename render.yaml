services:
  # ------- Flask Backend -------
  - type: web
    name: studybuddy-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_DEBUG
        value: "False"
      - key: MONGO_URI
        sync: false          # Set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Auto-generated by Render
      - key: JWT_SECRET_KEY
        generateValue: true  # Auto-generated by Render
      - key: ALLOWED_ORIGINS
        sync: false          # Set to your Vercel frontend URL after deploy

  # ------- React Frontend (Static Site) -------
  - type: web
    name: studybuddy-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # Set to your Render backend URL after deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
